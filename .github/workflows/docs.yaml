name: Docs

on:
  push:
    branches:
      - main
  # manual run
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install mdBook
        run: cargo install mdbook --no-default-features --features search --vers "^0.5" --locked

      # RFC-093: the shape playground's wasm module. Built before `mdbook
      # build` since mdBook copies docs/src/playground/*.js/.wasm verbatim
      # into the book output; this job runs with working-directory: docs, so
      # this step overrides back to the repo root explicitly (handoff §4).
      - name: Install wasm32 target
        working-directory: .
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        working-directory: .
        # Must match tools/matten-playground/Cargo.toml's pinned wasm-bindgen
        # version exactly, or wasm-bindgen refuses to process the module.
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Build the shape playground wasm module
        working-directory: .
        run: |
          cargo build --manifest-path tools/matten-playground/Cargo.toml \
            --target wasm32-unknown-unknown --release
          wasm-bindgen --target web \
            --out-dir docs/src/playground \
            --out-name matten_playground \
            tools/matten-playground/target/wasm32-unknown-unknown/release/matten_playground.wasm

      - name: Build book
        run: mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
